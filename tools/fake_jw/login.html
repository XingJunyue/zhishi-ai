<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>统一身份认证（测试页）</title>
<style>body{font-family:sans-serif;margin:0;background:#eef2f8}h3{background:#1f4e8c;color:#fff;margin:0;padding:14px;font-size:16px}
form{background:#fff;margin:24px 16px;padding:18px;border-radius:8px}input{display:block;width:92%;margin:8px 0 14px;padding:10px;font-size:15px}
button{width:100%;padding:12px;font-size:16px;background:#1f4e8c;color:#fff;border:0;border-radius:6px}.tip{font-size:12px;color:#888;margin:0 16px}</style></head><body>
<h3>××大学 统一身份认证（CI 测试页，不是真实学校）</h3>
<form id="f" onsubmit="return go()">
<label>学号 / 工号</label><input id="user" name="username" placeholder="学号 / 工号" autocomplete="username">
<label>密码</label><input id="pass" name="password" type="password" placeholder="密码" autocomplete="current-password">
<button id="login" type="submit">登 录</button>
</form>
<p class="tip">忘记密码？请联系信息中心</p>
<script>
function go(){var u=document.getElementById('user').value,p=document.getElementById('pass').value;
 if(!u||!p){alert('请输入学号和密码');return false;}
 document.cookie='jwsess=ok; path=/';location.href='home.html';return false;}
</script></body></html>
