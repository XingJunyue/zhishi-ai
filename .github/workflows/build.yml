name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 非 main 分支 = 预览包：-Ppreview 让 BuildConfig.PREVIEW=true，应用内更新器整个关掉。main 不带，更新器照旧。
      PV: ${{ github.ref != 'refs/heads/main' && '-Ppreview' || '' }}
      KS_PASS: ${{ secrets.KS_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.14.3' }
      - name: Signing key
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          # 知时 AI 自己的密钥（和知时不同），只在 Actions secret 里
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/zhishi-ai.p12"
          echo "KS_FILE=$RUNNER_TEMP/zhishi-ai.p12" >> "$GITHUB_ENV"
      - name: Build debug apk
        run: |
          mkdir -p out
          gradle :app:assembleDebug -PallAbi $PV --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk out/test-debug.apk
      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: test-report, path: app/build/reports/tests }
      - uses: actions/upload-artifact@v4
        with: { name: out, path: out }

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: out, path: out }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/wlat.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: shots, path: shots }
